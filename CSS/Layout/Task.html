<!DOCTYPE html>
<html>
<head>
<title>Flex Layout 2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

/* .container{
  min-height: 100vh;
  width:50%;              
  margin-right: auto;       
  display:flex;
  flex-direction:column;
  border:5px solid white;
} */
.container{
  min-height: 100vh;
  width:50%;
  margin-left:auto;   /* pushes layout to right */
  display:flex;
  flex-direction:column;
  border:5px solid white;
}

.box{
  padding:30px;
  border:8px solid white;
  text-align:center;
  color:black;
}

.top{
  display:flex;
}

.logo{
  flex:1;
  background:silver;
}

.nav{
    width: 30%;
  background:silver;
}

.header{
  background:silver;
}
.intro{
  background:silver;
}

.boxes{
  display:flex;
  flex:1;
}

.box1,.box2,.box3{
  width: 45%;
  background:silver;
}

.footer{
  background:slategrey;
}
</style>
</head>
<body>

<div class="container">
  <div class="top">
    <div class="box logo">Logo</div>
    <div class="box nav">Navigation</div>
  </div>
  <div class="box header" width="50%">Header / Banner</div>
  <div class="box intro">Intro Text Area</div>

  <div class="boxes">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
  </div>

  <div class="box footer">Footer</div>

</div>

</body>
</html>
