<!DOCTYPE html>
<html>
<head>
<title>Layouts</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="container">

  <!-- Layout 1 -->
  <div class="layout">
    <div class="logo">Logo</div>
    <div class="nav">Navigation</div>
    <div class="header">Header / Banner</div>

    <div class="main">
      <div class="sidebar">Side Bar</div>
      <div class="body">Body Area</div>
    </div>

    <div class="footer">Footer</div>
  </div>

  <!-- Layout 2 -->
  <div class="layout">
    <div class="top">
      <div class="logo">Logo</div>
      <div class="nav">Navigation</div>
    </div>

    <div class="header">Header / Banner</div>
    <div class="intro">Intro Text Area</div>

    <div class="boxes">
      <div>Box 1</div>
      <div>Box 2</div>
      <div>Box 3</div>
    </div>

    <div class="footer">Footer</div>
  </div>

  <!-- Layout 3 -->
  <div class="layout">
    <div class="logo">Logo</div>

    <div class="main">
      <div class="sidebar">Side Navigation</div>
      <div class="right">
        <div class="header">Header / Banner</div>
        <div class="body">Body Area</div>
      </div>
    </div>

    <div class="footer">Footer</div>
  </div>

  <!-- Layout 4 -->
  <div class="layout">
    <div class="top">
      <div class="logo">Logo</div>
      <div class="nav">Navigation</div>
    </div>

    <div class="grid">
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
    </div>

    <div class="boxes">
      <div>Box 1</div>
      <div>Box 2</div>
      <div>Box 3</div>
    </div>

    <div class="footer">Footer</div>
  </div>

</div>

</body>
</html>
