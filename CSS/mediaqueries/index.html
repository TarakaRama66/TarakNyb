<!DOCTYPE html>
<html>
<head>
<title>Orientation Media Query</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  color: white;
}

/* Portrait */
@media (orientation: portrait) {
  body {
    background-color: greenyellow;
  }
}

/* Landscape */
@media (orientation: landscape) {
  body {
    background-color: black;
  }
}
</style>

</head>
<body>

<h1>TarakRam</h1>

</body>
</html>
